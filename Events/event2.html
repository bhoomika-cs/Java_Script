<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events in JS</title>
</head>
<body>
    <button id="btn" onclick="changetext()">click me</button>
    <p id="p1">Hello Everyone</p>

    <input id="input" type="text" placeholder="Type here">
    
</body>
<script>
    
    // let btn = document.getElementById('btn').addEventListener('click', () => {
    //     alert('button clicked!!')
    // })
    function changetext(){
        document.querySelector('#p1').innerHTML = 'Button clicked!!'; //changes the text displaying on screen when button is clicked
    }

    document.getElementById('btn').addEventListener('input', () => {
        console.log('You are typing..');
        
    })

</script>
</html>
